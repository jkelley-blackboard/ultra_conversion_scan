# The rule table for the pre-conversion report.
#
# Each rule reads one query (source), picks rows (where), measures them (measure), and fires when the
# measure is above the threshold. `says` and `action` appear in reports for the institution: keep them
# plain and don't use em-dashes. Full syntax: README.md, "Writing rules".
#
# Sections run from most to least serious: tier 1 blocks learners, tier 2 needs fixing, tier 3
# improves the experience, and "to check" (severity 0) is unknown or can't be tested by the scan.

# Listed in every report under "Not checked".
not_checked_by_sql:
  - What a learner sees on screen (check with a learner view).
  - Links inside SCORM packages and Content Collection pages that point to the Original course.
  - Whether files linked from the Content Collection still exist.
  - Systems outside the LMS that store course or grade column IDs (give them the ID map from the hand-off report).

# Plain names shown in reports in place of system values (used when a rule lists examples).
labels:
  resource/x-bb-folder: Folder
  resource/x-bb-document: Document
  resource/x-bb-asmt-test-link: Test
  resource/x-bb-assignment: Assignment
  resource/x-bb-blankpage: Blank page
  resource/x-bb-externallink: Web link
  resource/x-bb-forumlink: Discussion link
  resource/x-plugin-scormengine: SCORM package
  resource/x-bb-wiki: Wiki
  resource/x-bb-bloglink: Blog
  resource/x-bb-achievement: Achievement
  resource/x-bb-module-page: Module page
  resource/x-bb-syllabus: Syllabus
  resource/x-bbpi-selfpeer-type1: Self and peer assessment
  resource/x-bb-courselink: Course link
  resource/x-bb-toollink: Tool link
  resource/x-bb-lesson: Learning module
  resource/x-bb-lesson-plan: Lesson plan
  resource/x-bb-blti-link: LTI link
  resource/x-bb-file: File
  resource/x-bb-image: Image
  resource/x-bb-video: Video
  resource/x-bb-audio: Audio
  resource/x-bb-journallink: Journal
  resource/x-bb-asmt-survey-link: Survey
  resource/x-bb-collaborate: Collaborate session
  resource/x-bb-youtube-mashup: YouTube mashup
  resource/x-bb-flickr-mashup: Flickr mashup
  resource/x-bb-slideshare-mashup: SlideShare mashup
  resource/x-bb-textbook: Textbook
  resource/x-bb-grouplink: Group link
  resource/x-bb-chatlink: Chat
  resource/x-bb-vclink: Virtual classroom
  resource/x-turnitin-assignment: Turnitin assignment

rules:

  # --- Tier 1: blocks learners ---------------------------------------------------------------

  - id: new_id_taken
    title: New course ID already in use
    source: S1
    where: {new_id_taken: true}
    severity: 1
    known: true
    says: "The new course ID {first[expected_new_course_id]} already exists (perhaps an earlier test copy), so the copy can't be made."
    action: Remove or rename the existing course before the conversion.
    decision: true

  - id: new_id_too_long
    title: New course ID too long
    source: S1
    measure: max(new_id_length)
    threshold: {config: max_course_id_length}   # 0 in the config switches this rule off
    severity: 1
    known: true
    says: "The new course ID {first[expected_new_course_id]} is {value} characters long."
    action: Agree a shorter ID for this course before the conversion.
    decision: true

  - id: open_attempts_at_freeze
    title: Test attempts open now
    source: S12
    where: {open_attempts__gt: 0}
    measure: sum(open_attempts)
    severity: 1
    known: true
    examples: test_title
    says: "{value} attempt(s) are open in {n} test(s): {examples}. An attempt still open at the freeze arrives in Ultra in progress."
    action: Ask learners to submit before the freeze. Re-run this scan at the freeze.

  - id: timed_open_attempts
    title: Timed tests with attempts open now
    source: S12
    where: {time_limit_minutes__gt: 0, open_attempts__gt: 0}
    severity: 1
    known: false
    examples: test_title
    says: "{n} timed test(s) have open attempts: {examples}. A timed attempt left open during the freeze may run out or submit itself."
    action: Clear these attempts before the freeze, or confirm how they arrive in Ultra.

  - id: open_assignment_attempts
    title: Assignments started but not submitted
    source: S7
    where: {open__gt: 0, score_provider_handle: resource/x-bb-assignment}
    measure: sum(open)
    severity: 1
    known: false
    examples: column_title
    says: "{value} assignment attempt(s) are saved as drafts but not submitted: {examples}."
    action: Ask learners to submit before the freeze, or check the drafts arrive in Ultra.

  - id: partial_credit_gating
    title: Partial credit in tests that open the next step
    source: S5b
    measure: sum(in_gating_tests)
    severity: 1
    known: true
    says: "{value} question(s) with partial credit are in tests whose score opens the next step. Conversion sets partial credit on wrong answers to 0%, so learners who haven't taken the test yet could score lower and be held back."
    action: Restore the answer values in the Ultra copy before learners use it (scripted from the pre-conversion data).

  - id: partial_credit_routing
    title: Partial credit in tests that route learners by score
    source: S5b
    measure: sum(in_routing_tests)
    severity: 1
    known: true
    says: "{value} question(s) with partial credit are in tests whose score sends learners down different paths. Conversion sets partial credit on wrong answers to 0%."
    action: Restore the answer values in the Ultra copy, then check one learner on each path.

  - id: groups_in_release_conditions
    title: Release conditions that depend on groups
    source: S8
    where: {criteria_using_group__gt: 0}
    severity: 1
    known: true
    examples: group_name
    says: "{n} group(s) control access to content: {examples}. Groups are not carried over, so this content would be closed to the learners it was meant for."
    action: Restore the groups and their members after the conversion (scripted), then check access.

  # --- Tier 2: needs fixing -----------------------------------------------------------------

  - id: partial_credit_graded
    title: Partial credit in graded tests
    source: S5c
    where: {real_partial: true}
    measure: distinct(question_pk)
    severity: 2
    known: true
    examples: test_title
    says: "{value} question(s) give partial credit for some wrong answers. Conversion sets those answers to 0%. Tests: {examples}."
    action: Restore the answer values in the Ultra copy (scripted from the pre-conversion data).

  - id: groups_dropped
    title: Groups with members
    source: S8
    where: {members__gt: 0}
    severity: 2
    known: true
    examples: group_name
    says: "{n} group(s) with members: {examples}. Groups are not carried over."
    action: Restore the groups and their members after the conversion (scripted).

  - id: course_links
    title: Course links
    source: S3c
    where: {cnthndlr_handle: resource/x-bb-courselink}
    measure: sum(items)
    severity: 2
    known: true
    says: "{value} course link(s). Conversion drops them (seen in conversion testing), apart from the course links it creates for discussions."
    action: Recreate each link in the Ultra copy, or replace it with a link to the item.

  - id: tool_links
    title: Tool links
    source: S3c
    where: {cnthndlr_handle: resource/x-bb-toollink}
    measure: sum(items)
    severity: 2
    known: true
    says: "{value} tool link(s) (links to course tools such as Announcements or the Gradebook). Conversion drops them (seen in conversion testing)."
    action: Recreate the ones learners need in the Ultra copy, where most course tools are already in the course navigation.

  - id: hidden_columns_shown
    title: Hidden grade columns that learners will see
    source: S4
    # In Ultra a column attached to an item shows to learners whenever the item does (seen in
    # conversion testing); the copy keeps the column marked hidden, but that doesn't hide it.
    where: {visible_ind: "N", item_available: "Y"}
    severity: 2
    known: true
    examples: title
    says: "{n} grade column(s) are hidden from learners today but attached to items they can open: {examples}. In Ultra a column shows whenever its item does, so learners will see these scores. They can't be hidden without hiding the item."
    action: Agree whether learners seeing these scores is acceptable, and whether to tell them. Removing a column removes its grades.
    decision: true

  - id: hidden_columns_no_item
    title: Hidden grade columns not attached to an item
    source: S4
    where: {visible_ind: "N", content_pk__null: true}
    severity: 2
    known: false
    examples: title
    says: "{n} grade column(s) are hidden from learners today and aren't attached to an item (totals, calculated or manual columns): {examples}."
    action: Check each is still hidden in the Ultra copy, and hide it there if not.

  - id: forum_release_conditions
    title: Release conditions on discussions
    source: S9
    where: {cnthndlr_handle: resource/x-bb-forumlink}
    severity: 2
    known: true
    examples: item_title
    says: "{n} release condition(s) are on discussions: {examples}. These are not carried over, so the discussions open to everyone in the course."
    action: Re-create the conditions in the Ultra copy, or agree to leave the discussions open.

  - id: nesting_beyond_limit
    title: Folders nested deeper than Ultra allows
    source: S3d
    # An Original content area becomes level 1 in Ultra, and a container needs a level below it for
    # its content (see S3d). Conversion testing showed each such container moved up to sit directly
    # in its learning module with the items directly in it, nested ones coming out beside it.
    severity: 2
    known: true
    examples: label
    says: "{n} folder(s) or learning module(s) are nested too deep for this site's {first[max_level]} levels of nested content in Ultra (a learning module, a folder, then content), holding {sums[items_here]} item(s) directly: {examples}. Conversion moves each one up to sit directly in its learning module, with those items, and a folder nested inside another comes out beside it rather than inside it, so the course's structure changes. Every item stays reachable, so this doesn't block learners."
    action: Ultra can't hold them at their old depth, so to restore the structure, remove a level above them (for example a content area that only groups others), then move them back; the hand-off report lists where each one landed. Or flatten them in the Original before the conversion.
    # The what-if for the additional nesting level. Turn off with nesting_what_if: false once the
    # site's setting has been decided.
    extra:
      config: nesting_what_if
      says: "With the additional nesting level (one more level; the site setting can't be undone), {sums[moves_one_level_more]} of these would still move."
      action: Or decide on the additional nesting level first.
      decision: true

  - id: undeployed_test_draws
    title: Tests that draw questions from an undeployed test
    source: S5f
    where: {becomes_bank: true, drawing_tests__gt: 0}
    measure: sum(draws)
    severity: 2
    known: false
    examples: drawing_test_titles
    says: "{value} question(s) are drawn from {n} undeployed test(s) by: {examples}. This site turns undeployed tests into question banks on conversion, and Blackboard's help says those banks lose random blocks, question sets and linked questions, so these tests may draw fewer questions in Ultra."
    action: Check the hand-off report's count of drawn questions. If it drops, point the draws at the new question bank in the Ultra copy.

  - id: undeployed_tests_hidden_folder
    title: Undeployed tests that conversion puts in a hidden folder
    source: S5f
    # With "undeployed tests become question banks" off (the default), conversion deploys them as tests
    # in a hidden folder at the top of the course, each with a grade column (seen in conversion testing).
    where: {becomes_bank: false}
    severity: 2
    known: true
    says: "{n} test(s) aren't deployed in the course. This site doesn't turn undeployed tests into question banks, so conversion puts them in a hidden folder at the top of the Ultra course, each with a grade column. Learners can't see them, so this doesn't block learners, but the extra columns appear in the ID map."
    action: Keep the folder hidden or remove it after the conversion. Removing it removes the extra grade columns too.

  - id: descriptions_lose_content
    title: Folder descriptions that lose links, media or files
    source: S3e
    where: {loses_content: true}
    severity: 2
    known: false
    examples: label
    says: "{n} folder or learning module description(s) have links, images, embedded media, attached files or more than 750 characters: {examples}. This site keeps descriptions as plain text of up to 750 characters on conversion, so those are lost."
    action: Recreate what learners need as items in the folder, or turn on the setting that converts descriptions to documents before the conversion.
    decision: true

  - id: removed_content_types
    title: Content that conversion removes
    source: S3c
    # From Blackboard's help (Course Preview, "Content types and settings that will NOT convert",
    # read 2026-11-14), matched to the content types seen on a demo site.
    where:
      cnthndlr_handle:
        - resource/x-bb-wiki
        - resource/x-bb-bloglink
        - resource/x-bb-achievement
        - resource/x-bb-module-page
        - resource/x-bb-syllabus
        - resource/x-bbpi-selfpeer-type1
    measure: sum(items)
    severity: 2
    known: true
    examples: cnthndlr_handle
    says: "{value} item(s) of a type Ultra doesn't support, which conversion removes: {examples}."
    action: Rebuild these in Ultra (for example as a document, a discussion or an LTI tool), or agree to drop them.
    decision: true

  - id: removed_question_types
    title: Question types that conversion removes
    source: S5d
    where: {removed_by_conversion: true}
    measure: sum(questions)
    severity: 2
    known: true
    examples: test_title
    says: "{value} question(s) of a type Ultra doesn't support (File Upload, Opinion Scale, Ordering or Quiz Bowl), in: {examples}. Conversion removes them, so the test's points change."
    action: Replace these questions, before or after converting. If the test opens the next step, treat this as blocking.

  - id: secure_browser
    title: Tests that require a secure browser
    source: S12
    where: {req_secure_browser_take_ind: "Y"}
    severity: 2
    known: false
    examples: test_title
    says: "{n} test(s) require a secure browser: {examples}."
    action: Check the setting in the Ultra copy before learners use it.

  - id: proctoring_service
    title: Tests with a proctoring service
    source: S12
    where: {proctoring_service_handle__notnull: true}
    severity: 2
    known: false
    examples: test_title
    says: "{n} test(s) use a proctoring service: {examples}."
    action: Check the setting in the Ultra copy before learners use it.

  # --- Tier 3: improves the experience -------------------------------------------------------

  - id: orphan_columns
    title: Grade columns not attached to an item
    source: S4
    where: {orphan_candidate: true}
    severity: 3
    known: false
    examples: title
    says: "{n} grade column(s) aren't attached to any item (entered by hand, or left over): {examples}."
    action: Optional tidy-up after the conversion.

  - id: dated_items
    title: Items with display dates
    source: S3
    measure: sum(dated_items)
    severity: 3
    known: false
    says: "{value} item(s) have display dates."
    action: Check the dates still make sense in Ultra.

  - id: documents_wrapped
    title: Items that conversion puts in a folder of their own
    source: S3c
    # Seen in conversion testing: every Original item (document) came out as a folder of the same
    # name holding the document, in every course checked (23 of 23).
    where: {cnthndlr_handle: resource/x-bb-document}
    measure: sum(items)
    severity: 3
    known: true
    says: "{value} item(s). Conversion puts each one in a folder of its own name, so learners open the folder, then the item. Nothing is lost."
    action: Unwrap them after the conversion by moving each item up and removing its folder.

  - id: descriptions_lose_formatting
    title: Folder descriptions that lose their formatting
    source: S3e
    where: {loses_formatting: true}
    severity: 3
    known: false
    says: "{n} folder or learning module description(s) use formatting (bold, italics, lists, tables, headings or styles). This site keeps descriptions as plain text on conversion, so the formatting is lost; the words are kept."
    action: Check the descriptions still read well as plain text.

  - id: descriptions_become_documents
    title: Folder descriptions that become documents
    source: S3e
    where: {becomes_document: true}
    severity: 3
    known: false
    says: "{n} folder or learning module description(s). This site turns each description into a document inside its folder on conversion, keeping its formatting, so each folder gains an item."
    action: Remove the documents learners don't need after the conversion, or turn off the setting that converts descriptions to documents before the conversion.

  # --- To check: unknown, or can't be tested by the scan -------------------------------------

  - id: source_available
    title: Course is available to learners
    source: S1
    where: {available_ind: "Y"}
    severity: 0
    known: true
    # Blackboard's help says available courses are skipped, but bulk copy and convert copied available
    # Originals in conversion testing, so the tool doesn't enforce the freeze: the process must.
    says: "The course is available to learners. Bulk copy and convert will still copy it, but work learners do in the Original after the copy isn't carried over."
    action: Make the course unavailable (closed) before the copy that carries learners over. This is a required step, not one the copy checks.

  - id: hidden_items
    title: Items hidden from learners
    source: S3b
    # In production conversions some items hidden in the Original came out visible; the cause
    # isn't known yet, so every hidden item is listed for checking.
    where: {available_ind: "N"}
    severity: 0
    known: false
    examples: title
    says: "{n} item(s) are hidden from learners: {examples}. In conversion testing some hidden items came out visible."
    action: Check each is still hidden in the Ultra copy before learners use it (the hand-off report lists any now visible).

  - id: open_scorm_attempts
    title: SCORM attempts in progress
    source: S7
    where: {open__gt: 0, score_provider_handle: resource/x-plugin-scormengine}
    measure: sum(open)
    severity: 0
    known: true
    examples: column_title
    says: "{value} SCORM attempt(s) are in progress: {examples}. In testing these resumed in Ultra, and the hand-off report compares each learner's saved place."
    action: Check the hand-off report's SCORM row; open a sample in the learner view if it shows differences.

  - id: waiting_for_grading
    title: Work waiting to be graded
    source: S7
    where: {needs_grading__gt: 0}
    measure: sum(needs_grading)
    severity: 0
    known: true
    examples: column_title
    says: "{value} submission(s) are waiting for a grader: {examples}. They carry over and can be graded in Ultra."
    action: Agree who grades them, and whether before the freeze or in Ultra.
    decision: true

  - id: inactive_waiting_for_grading
    title: Work waiting to be graded from students who can't open the course
    source: S2b
    where: {needs_grading__gt: 0}
    measure: sum(needs_grading)
    severity: 0
    known: true
    says: "{value} submission(s) from unavailable or disabled students are waiting for a grader. They carry over and can be graded in Ultra."
    action: Agree who grades them, and whether before the freeze or in Ultra.
    decision: true

  - id: content_type_untested
    title: Content types not yet covered by conversion testing
    source: S3c
    # Types seen converting correctly in testing (demo, 2026-11-14), plus types other rules already
    # flag. Add a type only after a test conversion shows it arrives and works in Ultra.
    where:
      cnthndlr_handle__ne:
        - resource/x-plugin-scormengine
        - resource/x-bb-forumlink
        - resource/x-bb-folder
        - resource/x-bb-document
        - resource/x-bb-asmt-test-link
        - resource/x-bb-externallink
        - resource/x-bb-assignment
        - resource/x-bb-blankpage
        - resource/x-bb-courselink
        - resource/x-bb-toollink
        - resource/x-bb-wiki
        - resource/x-bb-bloglink
        - resource/x-bb-achievement
        - resource/x-bb-module-page
        - resource/x-bb-syllabus
        - resource/x-bbpi-selfpeer-type1
    measure: sum(items)
    severity: 0
    known: false
    examples: cnthndlr_handle
    says: "{value} item(s) of {n} content type(s) not yet covered by conversion testing: {examples}."
    action: Convert one example in a test course and check it in Ultra before this course converts.

  - id: test_exceptions
    title: Test exceptions (extra time or attempts)
    source: S12b
    severity: 0
    known: false
    examples: test_title
    says: "{n} test exception(s) for individual learners or groups, in: {examples}."
    action: Check they carry over to the Ultra copy.

  - id: group_test_exceptions
    title: Test exceptions given to a group
    source: S8
    where: {test_exceptions_using_group__gt: 0}
    severity: 0
    known: false
    examples: group_name
    says: "{n} group(s) have test exceptions: {examples}. Groups are not carried over."
    action: Check the exceptions after the groups are restored.

  - id: proportional_credit
    title: Questions that give partial credit in proportion
    source: S5c
    where: {weights_found: 0}
    measure: distinct(question_pk)
    severity: 0
    known: false
    says: "{value} question(s) give credit in proportion to how much is right (matching, jumbled sentence and similar types)."
    action: Check the partial-credit setting carried over on one of them.

  - id: calculated_gates
    title: Release conditions on calculated columns
    source: S9
    where: {gate_column_calculated__ne: ["N", null]}
    severity: 0
    known: false
    examples: gate_column_title
    says: "{n} release condition(s) depend on a calculated column: {examples}. A test that feeds the column controls access indirectly."
    action: Check whether any test feeding these columns uses partial credit, and check the column's value for a sample of learners in Ultra.

  - id: named_user_conditions
    title: Release conditions that name individual learners
    source: S9
    where: {users_named_count__gt: 0}
    severity: 0
    known: false
    examples: item_title
    says: "{n} release condition(s) name individual learners, on: {examples}."
    action: Check they carry over.

  - id: cc_landing_pages
    title: HTML pages in the Content Collection
    source: S3
    measure: sum(cc_html_pages)
    severity: 0
    known: false
    says: "{value} link(s) open HTML pages in the Content Collection. These pages may have Original course addresses built in."
    action: Open the pages and look for links to the Original course.

  - id: cc_references
    title: Links to the Content Collection
    source: S3
    measure: sum(cc_references)
    severity: 0
    known: false
    says: "{value} item(s) link to files in the Content Collection."
    action: Keep the files in place, and open a sample in the Ultra copy.

  - id: lti_items
    title: LTI tool links
    source: S3
    measure: sum(lti_items)
    severity: 0
    known: false
    says: "{value} LTI tool link(s)."
    action: Launch each tool once in the Ultra copy.

  - id: scorm_time_limit
    title: SCORM packages with a time limit
    source: S6
    where: {player_time_limit__gt: 0}
    severity: 0
    known: false
    examples: title
    says: "{n} SCORM package(s) have a player time limit: {examples}."
    action: Check the limit in the Ultra copy.
