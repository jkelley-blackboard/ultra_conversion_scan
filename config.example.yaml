# Copy to config.yaml (ignored by Git) and pass with --config. One file per site works well
# (config_<site>.yaml). Every key is optional.

db:                                     # the site's DDA connection. Never put the password here:
  host: TODO.example.com                #   convscan asks for it, or reads DDA_PASSWORD if set.
  port: 5432                            #   A DDA_HOST, DDA_PORT, DDA_DBNAME or DDA_USER
  dbname: TODO                          #   environment variable overrides the value here.
  user: TODO

prepared_for: TODO institution name     # shown at the top of each report
new_id_suffix: "-7777"                  # copy course_id = Original course_id + suffix. Bulk copy and
                                        # convert always adds a hyphen before its suffix, so include it
max_course_id_length: 15                # flag new IDs longer than this (0 = no limit)
statement_timeout_s: 900                # per query, on the database side
learner_queries: true                   # false = skip S7, S8b, S10, S12b (same as --no-learner)
max_replica_lag_s: 300                  # post won't run while the reporting database (a read replica)
                                        # trails production by more than this; --ignore-lag overrides
rules: null                             # path to a rule table; null = the packaged default
templates: null                         # folder of .md.j2 templates; null = the packaged ones
