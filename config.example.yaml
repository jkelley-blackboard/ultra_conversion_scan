# 'convscan init' writes a starter config to ~/convscan/config.yaml, which convscan then finds
# without --config. Or copy this file (one per site works well, config_<site>.yaml) and pass it
# with --config. Every key is optional.

db:                                     # the site's DDA connection. Never put the password here:
  host: TODO.example.com                #   convscan asks for it, or reads DDA_PASSWORD if set.
  port: 5432                            #   A DDA_HOST, DDA_PORT, DDA_DBNAME or DDA_USER
  dbname: TODO                          #   environment variable overrides the value here.
  user: TODO

data_dir: ~/convscan/data               # each run's data: learner-level CSVs and run.json. Keep it
                                        #   local, not synced or shared (convscan warns if it is).
reports_dir: ~/convscan/reports         # each run's reports, idmap.csv and a copy of run.json: what
                                        #   gets shared. Relative paths are relative to this file.

prepared_for: TODO institution name     # shown at the top of each report
new_id_prefix: ""                       # copy course_id = prefix + Original course_id + suffix. Bulk
new_id_suffix: "-7777"                  #   copy and convert always adds a hyphen between the Original
                                        #   ID and its prefix or suffix, so include it: "ULTRA-" or "-7777"
max_course_id_length: 15                # flag new IDs longer than this (0 = no limit)
statement_timeout_s: 900                # per query, on the database side
learner_queries: true                   # false = skip S7, S8b, S10, S12b (same as --no-learner).
                                        # S7, S8b and S10 read students in progress only, unless
                                        # pre --all-learners; S2b totals the rest

max_replica_lag_s: 300                  # post won't run while the reporting database (a read replica)
                                        # trails production by more than this; --ignore-lag overrides
rules: null                             # path to a rule table; null = the packaged default
templates: null                         # folder of .md.j2 templates; null = the packaged ones
